<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Mochila Escolar</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            margin: 0;
            padding: 0;
            text-align: center;
            color: #333;
        }

        h1 {
            margin-top: 30px;
            color: white;
        }

        .mochila {
            background: white;
            width: 320px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: #2c3e50;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #ecf0f1;
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.3s;
            cursor: pointer;
        }

        li:hover {
            background: #d0e6ff;
        }

        .checked {
            text-decoration: line-through;
            background: #a3e4d7;
        }
    </style>
</head>
<body>

</html>
